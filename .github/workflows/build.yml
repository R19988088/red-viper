name: Build Red Viper 3DS Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build release CIA
        run: git config --global --add safe.directory "$PWD" && make release-3ds

      - name: Publish direct CIA download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="red-viper-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_json="$(curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${tag}\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"Red Viper ${GITHUB_RUN_NUMBER}\",\"body\":\"Release build from GitHub Actions.\",\"draft\":false,\"prerelease\":true}")"
          upload_url="$(printf '%s' "$release_json" | sed -n 's/.*"upload_url":[[:space:]]*"\([^"]*\)".*/\1/p' | sed 's/{?name,label}//')"
          test -n "$upload_url"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @red-viper.cia \
            "${upload_url}?name=red-viper.cia"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/red-viper.cia"
          {
            echo "## Red Viper CIA Release"
            echo
            echo "[Download red-viper.cia](${download_url})"
          } >> "$GITHUB_STEP_SUMMARY"
